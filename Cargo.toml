[workspace]
resolver = "3"
members = ["crates/notes-app", "crates/notes-editor", "crates/notes-markdown", "crates/notes-vault", "crates/notes-ai", "crates/notes-glimpse", "crates/notes-sync", "crates/notes-plugins"]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Ken Smith"]
repository = "https://github.com/design-nexus/nyx-notes"

[workspace.dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
gio = "0.22"
sourceview5 = "0.11"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
blake3 = "1"
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "52cba5e27a3dd5f00c780f53e423302b4b5f9c9c" }
nyx-share-client = { git = "https://github.com/design-nexus/nyx-share.git", rev = "3923640afdcbfe09fa4c1faaf7d952db071f3812" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "b723d5535652a8e23e4676c328a02900fd17be0f" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "b723d5535652a8e23e4676c328a02900fd17be0f" }

[profile.release]
lto = "thin"
strip = true

