[package]
name = "notes-sync"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
nyx-cloud = { git = "https://github.com/design-nexus/nyx-cloud.git", rev = "a65d14cce64bc0cbce1a8ecfa711fae8a0290835" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
gio.workspace = true
notes-vault = { path = "../notes-vault" }
nyx-sync = { git = "https://github.com/design-nexus/nyx-core.git", rev = "a258c315f056ac649586fdb55e98613056221411" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = "2"
percent-encoding = "2"
roxmltree = "0.21"
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
rustix = { version = "1", features = ["fs"] }
